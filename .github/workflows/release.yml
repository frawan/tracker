name: Release

# Builds the signed "Ibadah Tracker" APK and publishes it as a GitHub Release.
# Only runs when started by hand: Actions → Release → Run workflow → enter the version.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number, e.g. 2.1.0 (must be new)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check version format
        run: |
          if ! echo "${{ inputs.version }}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version must look like 2.1.0"; exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Check signing secrets are set
        env:
          KS: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.RELEASE_KEY_ALIAS }}
          KP: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          for v in KS KSP KA KP; do
            if [ -z "${!v}" ]; then echo "::error::Signing secrets are missing. See docs/android/RELEASING.md"; exit 1; fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install and bundle web app
        run: |
          npm ci
          npm run build
          npm run android:sync

      - name: Build signed release APK
        working-directory: android
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RELEASE_KEYSTORE_PATH"
          # versionCode = 100 + run number, so every release is higher than the last
          ./gradlew assembleRelease --no-daemon \
            -PappVersionName=${{ inputs.version }} \
            -PappVersionCode=$((100 + ${{ github.run_number }}))
          rm -f "$RELEASE_KEYSTORE_PATH"

      - name: Verify signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | head -3
          cp android/app/build/outputs/apk/release/app-release.apk "ibadah-tracker-v${{ inputs.version }}.apk"
          # Same file under a fixed name, so .../releases/latest/download/ibadah-tracker.apk always works
          cp android/app/build/outputs/apk/release/app-release.apk ibadah-tracker.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" "ibadah-tracker-v${{ inputs.version }}.apk" ibadah-tracker.apk \
            --target main \
            --title "Ibadah Tracker v${{ inputs.version }}" \
            --notes "Android app (phone and tablet). Install guide: https://frawan.github.io/tracker/android.html"
